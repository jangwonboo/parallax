<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://use.typekit.net; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com https://use.typekit.net; img-src 'self' data:; media-src 'self' blob:; script-src 'self'; connect-src 'none'">
<title>Parallax</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="reader.css">
</head>
<body>

<!-- 툴바에는 늘 쓰는 것만 남긴다. 조판 컨트롤 일곱 개를 한 줄에 늘어놓으면
     1400px 에서 이미 가로 스크롤이 생겼다. -->
<header class="bar">
  <button id="tocBtn" aria-expanded="false">목차</button>
  <button id="typeBtn" aria-expanded="false" aria-controls="typePanel">조판</button>
  <!-- 테마는 둘뿐이라 셀렉트 대신 토글 버튼 — 결과가 화면 전체로 보인다 -->
  <button id="themeBtn" aria-pressed="false" title="밝게 · 어둡게 전환">색상</button>
</header>

<div class="panel" id="typePanel" data-open="false" role="group" aria-label="조판">
  <label class="ctl"><span>배치</span>
    <select id="layoutSel" aria-label="원문·번역 배치">
      <option value="lr">원문 왼쪽</option>
      <option value="rl">번역 왼쪽</option>
    </select></label>
  <label class="ctl"><span>영문 글꼴</span>
    <select id="faceSrc" aria-label="영문 글꼴"></select></label>
  <label class="ctl"><span>한글 글꼴</span>
    <select id="faceKo" aria-label="한글 글꼴"></select></label>
  <label class="ctl"><span>글꼴 크기</span>
    <input type="range" id="size" min="10" max="24" step="1" aria-label="글꼴 크기">
    <output id="sizeOut"></output></label>
  <label class="ctl"><span>줄간격</span>
    <input type="range" id="lead" min="0" max="4" step="1" aria-label="줄간격">
    <output id="leadOut"></output></label>
  <label class="ctl"><span>단락간격</span>
    <input type="range" id="para" min="0" max="2" step="1" aria-label="단락간격">
    <output id="paraOut"></output></label>
  <label class="ctl"><span>본문 폭</span>
    <input type="range" id="width" min="50" max="100" step="5" aria-label="본문 폭">
    <output id="widthOut"></output></label>
  <button id="evenBtn" class="wide" title="좌우 폭을 절반으로">좌우 폭 균등</button>
</div>

<nav class="toc" id="toc" data-open="false" aria-label="목차"></nav>

<main class="doc linked" id="doc">
  <!-- 빈 화면에는 진입점 하나만 — 설명문은 다 뺐다(사용자 지시, 2026-08-06) -->
  <div class="welcome" id="welcome">
    <button id="openBtn2">문서 열기</button>
  </div>
  <button class="handle" id="handle" hidden aria-label="좌우 폭 조절"
          role="separator" aria-orientation="vertical"
          aria-valuemin="20" aria-valuemax="80" aria-valuenow="50"></button>
</main>

<aside class="dict" id="dict" data-open="false" role="dialog" aria-label="사전">
  <div class="head">
    <span class="word" id="dWord"></span>
    <span class="ipa" id="dIpa"></span>
    <button id="dClose" aria-label="닫기">✕</button>
  </div>
  <div class="body">
    <section><h4>영한</h4><div id="dKo" class="ko-gloss spin">…</div></section>
    <section><h4>영영</h4><div id="dEn" class="spin">…</div></section>
  </div>
  <div class="links" id="dLinks"></div>
</aside>

<dialog class="keydlg" id="keyDlg" aria-label="Anthropic API 키">
  <form method="dialog">
    <h3>Anthropic API 키</h3>
    <p class="state" id="keyState"></p>
    <input type="password" id="keyInput" placeholder="sk-ant-…" autocomplete="off"
           spellcheck="false" aria-label="API 키">
    <p class="hint">키는 OS 보안 저장소로 암호화되어 저장됩니다.
       저장된 키는 다시 표시되지 않습니다.</p>
    <p class="err" id="keyErr" hidden></p>
    <menu>
      <button type="button" id="keyClear" class="ghost">지우기</button>
      <span class="sp"></span>
      <button type="button" id="keyCancel" class="ghost">취소</button>
      <button type="button" id="keySave">저장</button>
    </menu>
  </form>
</dialog>

<!-- 추출·페이지 검증 진행. 검증은 몇 분씩 걸리므로 어디까지 갔는지와
     멈추는 방법이 늘 보여야 한다. -->
<div class="importing" id="importing" hidden role="status" aria-live="polite">
  <span class="pulse" aria-hidden="true"></span>
  <span class="what" id="impWhat"></span>
  <span class="detail" id="impMsg"></span>
  <button id="impCancel">취소</button>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
